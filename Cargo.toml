[package]
name = "r1-canfd"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Galaxea R1 Pro CAN FD bus, receive only: SocketCAN FD socket with kernel timestamps, candump -L log reader, typed decoders for every feedback ID (IMUs, BMS, chassis, torso, arms, grippers, temperatures, versions, errors, e-stop) and a per-ID rate/staleness tracker"
license = "Apache-2.0"
repository = "https://github.com/jeff-hykin/r1-canfd-rust"
readme = "README.md"
keywords = ["robotics", "galaxea", "r1", "canfd", "socketcan"]
categories = ["science::robotics", "network-programming", "parser-implementations"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
# Adds Bus::send. Off by default: nothing in this crate can put a frame on the bus unless a binary opts in.
transmit = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "r1_canfd_dump"
path = "src/bin/r1_canfd_dump.rs"
